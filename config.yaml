
# Most important settings:

quality: "maximum"  # "minimum", "low", "medium", "high", "maximum"
# Default resource tier. Used by a modality only when that modality doesn't
# set its own "variant"/"model" below (leave it null to inherit from here).

# DATASET LOCATIONS
dataset:
  videos_dir: "demo_data"

# Each modality can be turned on/off independently ("enabled"), and most let
# you pick which model variant runs it. A disabled modality's model is never
# loaded, so its weight file doesn't need to exist. The server tells clients
# which modalities are active (and with which variant) when they connect.
modalities:

  face_detection:
    enabled: true
    model_path: "data/models/yolov8-face/yolov8m-face.pt"

  face_landmarks:
    enabled: true
    model_path: "data/models/mediapipe/face_landmarker.task"

  pose_landmarks:
    enabled: true
    variant: null  # "lite" | "full" | "heavy" | null (null = derive from `quality`)
    model_path: "data/models/mediapipe/pose_landmarker_heavy.task"

  # Gaze estimation. "method" selects which model runs; only that method's
  # weights need to be present.
  gaze:
    enabled: true
    method: "mobilegaze"  # "gaze360" | "l2cs" | "mobilegaze"
    gaze360_model: "data/models/gaze360/gaze360_model.pth"
    l2cs_model: "data/models/l2cs/L2CSNet_gaze360.pkl"
    mobilegaze_arch: "mobilenetv2"  # "resnet18" | "resnet34" | "resnet50" | "mobilenetv2"
    mobilegaze_model: "data/models/mobilegaze/mobilenetv2.pt"
    # gaze needs face_detection enabled to get a face crop; if face_detection
    # is disabled, gaze will never produce output even if enabled here.

  # Emotion recognition (EmoNet): 8-class expression + continuous
  # valence/arousal from the same face crop gaze uses. CC BY-NC-ND 4.0 —
  # non-commercial use only, see data/models/emonet/LICENSE. Off by default
  # so the license terms are an explicit opt-in, not a surprise.
  emotion:
    enabled: false
    model_path: "data/models/emonet/emonet_8.pth"
    # emotion needs face_detection enabled to get a face crop; if face_detection
    # is disabled, emotion will never produce output even if enabled here.

  speech:
    enabled: true
    model: null  # "tiny" | "base" | "small" | "medium" | "large-v2" | "large-v3" | null (null = derive from `quality`)
    word_timestamps: true
    chunk_seconds: 3.0

  # Sentiment runs on the text speech produces, so it's a no-op unless
  # `speech` is also enabled.
  sentiment:
    enabled: true
    model: "cardiffnlp/twitter-xlm-roberta-base-sentiment"

landmarks:
  right_eyebrow_landmarks: [276, 282, 283, 285, 293, 295, 296, 300, 334, 336]
  left_eyebrow_landmarks:  [46, 52, 53, 55, 63, 65, 66, 70, 105, 107]
  right_eye_landmarks:      [249, 263, 362, 373, 374, 380, 381, 382, 384, 385, 386, 387, 388, 390, 398, 466]
  left_eye_landmarks:       [7, 33, 133, 144, 145, 153, 154, 155, 157, 158, 159, 160, 161, 163, 173, 246]

  upper_lip_landmarks: [61, 185, 40, 39, 37, 0, 267, 269, 270, 409, 291, 306, 292, 308, 415, 310, 311, 312, 13, 82, 81, 80, 191, 78, 62, 76]
  lower_lip_landmarks: [61, 76, 62, 78, 95, 88, 178, 87, 14, 317, 402, 318, 324, 308, 292, 306, 291, 375, 321, 405, 314, 17, 84, 181, 91, 146]

